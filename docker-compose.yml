# Compose untuk VPS.
#
# Reverse proxy + TLS TIDAK ada di sini: ditangani Nginx Proxy Manager (NPM) yang
# sudah jalan di VPS. Container `web` menempel ke network eksternal `npm-net`
# supaya NPM bisa mem-forward ke `portfolio-web:3000` lewat nama container.
# Port tidak dibuka ke host, jadi app tidak bisa diakses langsung dari internet.
#
# Sekali di VPS:  docker network create npm-net
#                 docker network connect npm-net <nama-container-npm>
#
# Rollback: set IMAGE_TAG=<tag-sha> di .env lalu `docker compose up -d web`.

services:
  web:
    image: ghcr.io/ryunoo09/web-portofolio:${IMAGE_TAG:-latest}
    container_name: portfolio-web
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    networks:
      - npm-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Pakai node + 127.0.0.1, bukan wget + localhost: di Alpine `localhost`
      # sering di-resolve ke IPv6 (::1) sementara Next hanya mendengarkan IPv4,
      # sehingga healthcheck gagal walau aplikasi sehat.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  npm-net:
    external: true
    name: npm-net